[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-model-agentflow"
version = "0.1.0"
description = "Risk-aware, model-agnostic task execution and review control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
